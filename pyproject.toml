[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogload"
version = "0.1.0"
description = "Real-Time Cognitive Load Estimation via Facial and Ocular Behavioral Signals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-contrib-python",
    "mediapipe",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "xgboost",
    "flask",
    "pyyaml",
    "pyarrow",
    "joblib",
    "matplotlib",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
